.policy-body th,.policy-body td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}

.footer-links a:hover{color:var(--accent);text-decoration:none}

    "sections": "<article class=\"policy-card\" id=\"section-1\"><h2><span class=\"policy-num\">01</span>What VKT CleanMate does</h2><div class=\"policy-body\"><div class=\"box\"><strong>Short version:</strong> VKT CleanMate is a self-service privacy tool for your own browser. It does not collect, transmit or sell your browsing data. Everything it knows stays on your device.</div>\n<p>VKT CleanMate deletes browsing data (history, cache, cookies and other site data) that you ask it to delete, on a schedule or on demand. You control the scope: either only the domains on your clean list, or all domains except those on your protected list.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-2\"><h2><span class=\"policy-num\">02</span>Data we store locally</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Stored item</th><th>Purpose</th><th>Lifetime</th></tr>\n<tr><td>Your settings (lists, schedule, data types)</td><td>Remember your configuration</td><td>Until you uninstall</td></tr>\n<tr><td>Focus footprint (domain, focus duration, visit count, hour distribution)</td><td>Power the Footprint page</td><td>30-day rolling window, off by default</td></tr>\n<tr><td>Last clean summary</td><td>Show when the last run happened</td><td>Overwritten on every run</td></tr>\n<tr><td>Install ID (random)</td><td>Bind a licence key to a device</td><td>Until you uninstall</td></tr>\n</table></div></div></article>\n\n<article class=\"policy-card\" id=\"section-3\"><h2><span class=\"policy-num\">03</span>Focus footprint is opt-in and minimal</h2><div class=\"policy-body\"><ul>\n<li>The feature is off by default. Nothing is recorded until you turn it on.</li>\n<li>By default it only records while the Footprint page is open. Close the page and recording stops.</li>\n<li>It stores only the domain, the focused duration, the visit count and an hour-of-day histogram.</li>\n<li>It does not store full URLs, page titles, search terms, screenshots or page content.</li>\n<li>Data expires automatically after 30 days and can be wiped at any time with “Clear stats”.</li>\n<li>The footprint is part of the paid tier; the CSV export lives on the same page.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-4\"><h2><span class=\"policy-num\">04</span>What we never do</h2><div class=\"policy-body\"><ul>\n<li class=\"no-mark\">❌ No analytics, no telemetry, no crash reporting, no advertising identifiers.</li>\n<li class=\"no-mark\">❌ No browsing data is ever uploaded to a server.</li>\n<li class=\"no-mark\">❌ No data is sold or shared with third parties.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-5\"><h2><span class=\"policy-num\">05</span>Network requests</h2><div class=\"policy-body\"><p>The only outbound request is licence verification, and only if you enter a licence key. It sends the licence key, a random install ID, the plugin ID and basic environment info (browser name/version, UI language, timezone) to api.annmax1983.com, at most once every two hours. It contains no browsing data.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-6\"><h2><span class=\"policy-num\">06</span>Permissions and why they are needed</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Permission</th><th>Why</th></tr>\n<tr><td><code>browsingData</code></td><td>Delete the data types you select. Core function.</td></tr>\n<tr><td><code>storage</code></td><td>Save your settings and the local footprint on your device.</td></tr>\n<tr><td><code>alarms</code></td><td>Run scheduled cleanups and keep focus timing alive across service-worker restarts.</td></tr>\n<tr><td><code>tabs</code> / <code>windows</code></td><td>Detect the active domain, per-site actions, and the last-window-closed moment.</td></tr>\n<tr><td><code>idle</code></td><td>Optional “after idle” trigger.</td></tr>\n<tr><td><code>notifications</code></td><td>Show the result summary after a cleanup.</td></tr>\n<tr><td><code>history</code> <em>(optional)</em></td><td>Requested only when you preview or clean history for specific sites. Local use only.</td></tr>\n<tr><td><code>cookies</code> <em>(optional)</em></td><td>Requested only when you clean cookies for specific sites.</td></tr>\n</table></div>\n<p>Optional permissions are requested at the moment you use the related feature, and can be revoked in the browser at any time.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-7\"><h2><span class=\"policy-num\">07</span>What VKT CleanMate cannot do</h2><div class=\"policy-body\"><ul>\n<li>It cannot clear DNS caches, router logs, ISP records or server-side logs.</li>\n<li>It cannot restore deleted history — the browser provides no API to write history back.</li>\n<li>It cannot clean other browsers’ data, other profiles, or a synced copy on another device.</li>\n<li>“On browser close” is best-effort: if the browser exits before the task finishes, cleanup is completed a few seconds after the next start.</li>\n<li>It is not an anti-forensics or anti-surveillance tool, and it does not make you anonymous.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-8\"><h2><span class=\"policy-num\">08</span>Children</h2><div class=\"policy-body\"><p>VKT CleanMate is a general-purpose utility and is not directed at children under 13.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-9\"><h2><span class=\"policy-num\">09</span>Changes</h2><div class=\"policy-body\"><p>Material changes to this policy will be reflected in the “Last updated” date above and in the extension’s release notes.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-10\"><h2><span class=\"policy-num\">10</span>Contact</h2><div class=\"policy-body\"><p>Questions about privacy: annmax1983.com</p>\n<p><a href=\"mailto:support@annmax1983.com\">support@annmax1983.com</a></p></div></article>"

    "sections": "<article class=\"policy-card\" id=\"section-1\"><h2><span class=\"policy-num\">01</span>VKT CleanMate 做什么</h2><div class=\"policy-body\"><div class=\"box\"><strong>简短版：</strong> VKT CleanMate 是给你自己浏览器用的自助隐私工具。它不收集、不上传、不出售你的浏览数据。它知道的一切都留在你的设备上。</div>\n<p>VKT CleanMate 按你的要求删除浏览数据（历史、缓存、Cookie 及其它站点数据），可以定时执行，也可以手动触发。范围由你决定：只删清理名单里的域名，或者删除保护名单之外的全部域名。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-2\"><h2><span class=\"policy-num\">02</span>我们本地保存什么</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>保存内容</th><th>用途</th><th>保留时长</th></tr>\n<tr><td>你的设置（名单、计划、数据类型）</td><td>记住你的配置</td><td>直到你卸载</td></tr>\n<tr><td>专注足迹（域名、专注时长、访问次数、小时分布）</td><td>支撑足迹页面</td><td>30 天滚动过期，默认关闭</td></tr>\n<tr><td>上次清理摘要</td><td>显示上次执行时间</td><td>每次执行时覆盖</td></tr>\n<tr><td>安装 ID（随机生成）</td><td>把授权码绑定到设备</td><td>直到你卸载</td></tr>\n</table></div></div></article>\n\n<article class=\"policy-card\" id=\"section-3\"><h2><span class=\"policy-num\">03</span>专注足迹是可选且最小化的</h2><div class=\"policy-body\"><ul>\n<li>该功能默认关闭。你不打开它，就不会记录任何东西。</li>\n<li>默认只在足迹页面打开时记录。页面关掉，记录就停。</li>\n<li>只保存域名、专注时长、访问次数和一张按小时的分布。</li>\n<li>不保存完整 URL、页面标题、搜索词、截图或页面内容。</li>\n<li>数据 30 天后自动过期，任何时候都能用「清空统计」删掉。</li>\n<li>专注足迹属于付费能力，CSV 导出也在同一个页面里。</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-4\"><h2><span class=\"policy-num\">04</span>我们绝不会做的事</h2><div class=\"policy-body\"><ul>\n<li class=\"no-mark\">❌ 没有统计分析，没有埋点，没有崩溃上报，没有广告标识符。</li>\n<li class=\"no-mark\">❌ 任何浏览数据都不会被上传到服务器。</li>\n<li class=\"no-mark\">❌ 不向第三方出售或共享任何数据。</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-5\"><h2><span class=\"policy-num\">05</span>网络请求</h2><div class=\"policy-body\"><p>唯一的对外请求是授权校验，而且只在你输入授权码之后才发生。它会把授权码、随机安装 ID、插件 ID 和基本环境信息（浏览器名称/版本、界面语言、时区）发送到 api.annmax1983.com，最多每两小时一次，其中不含任何浏览数据。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-6\"><h2><span class=\"policy-num\">06</span>权限及其用途</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>权限</th><th>用途</th></tr>\n<tr><td><code>browsingData</code></td><td>删除你选择的数据类型，核心功能。</td></tr>\n<tr><td><code>storage</code></td><td>在本机保存设置与专注足迹。</td></tr>\n<tr><td><code>alarms</code></td><td>执行定时清理，并在 Service Worker 重启后继续专注计时。</td></tr>\n<tr><td><code>tabs</code> / <code>windows</code></td><td>识别当前域名、按站点操作，以及最后一个窗口关闭的时刻。</td></tr>\n<tr><td><code>idle</code></td><td>可选的「空闲后」触发。</td></tr>\n<tr><td><code>notifications</code></td><td>清理完成后显示结果摘要。</td></tr>\n<tr><td><code>history</code> <em>(optional)</em></td><td>只在你按站点预览或清理历史时申请，仅本地使用。</td></tr>\n<tr><td><code>cookies</code> <em>(optional)</em></td><td>只在你按站点清理 Cookie 时申请。</td></tr>\n</table></div>\n<p>可选权限在你使用相关功能的那一刻才申请，并且随时可以在浏览器里撤销。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-7\"><h2><span class=\"policy-num\">07</span>VKT CleanMate 做不到什么</h2><div class=\"policy-body\"><ul>\n<li>清不掉 DNS 缓存、路由器日志、运营商记录或网站服务端日志。</li>\n<li>恢复不了已删除的历史 —— 浏览器没有写入历史的接口。</li>\n<li>清不了其它浏览器的数据、其它配置文件，或者同步到别的设备上的那一份。</li>\n<li>「关闭浏览器时」是尽力而为：如果浏览器在任务完成前退出，清理会在下次启动后几秒内补完。</li>\n<li>它不是反取证工具，也不是反监控工具，不会让你变成匿名状态。</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-8\"><h2><span class=\"policy-num\">08</span>儿童</h2><div class=\"policy-body\"><p>VKT CleanMate 是通用工具，不面向 13 岁以下儿童。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-9\"><h2><span class=\"policy-num\">09</span>变更</h2><div class=\"policy-body\"><p>本政策的实质性变更会更新上方的「最后更新」日期，并记录在扩展的版本说明里。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-10\"><h2><span class=\"policy-num\">10</span>联系</h2><div class=\"policy-body\"><p>隐私相关问题：annmax1983.com</p>\n<p><a href=\"mailto:support@annmax1983.com\">support@annmax1983.com</a></p></div></article>"

    "sections": "<article class=\"policy-card\" id=\"section-1\"><h2><span class=\"policy-num\">01</span>VKT CleanMate の役割</h2><div class=\"policy-body\"><div class=\"box\"><strong>要約：</strong> VKT CleanMate は、自分のブラウザのためのセルフサービス型プライバシーツールです。閲覧データを収集・送信・販売しません。把握した情報はすべて端末内に残ります。</div>\n<p>VKT CleanMate は、あなたの指示に従って閲覧データ（履歴、キャッシュ、Cookie、その他のサイトデータ）を、スケジュールまたは手動で削除します。範囲はあなたが決めます。クリーンリストのドメインのみ、または保護リスト以外のすべてです。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-2\"><h2><span class=\"policy-num\">02</span>ローカルに保存するデータ</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>保存内容</th><th>目的</th><th>保存期間</th></tr>\n<tr><td>設定（リスト、スケジュール、データ種別）</td><td>設定の記憶</td><td>アンインストールまで</td></tr>\n<tr><td>フォーカス足跡（ドメイン、フォーカス時間、訪問回数、時間帯分布）</td><td>足跡ページの表示</td><td>30 日のローリング、既定はオフ</td></tr>\n<tr><td>前回の削除摘要</td><td>前回の実行時刻の表示</td><td>実行のたびに上書き</td></tr>\n<tr><td>インストール ID（ランダム）</td><td>ライセンスを端末に紐付け</td><td>アンインストールまで</td></tr>\n</table></div></div></article>\n\n<article class=\"policy-card\" id=\"section-3\"><h2><span class=\"policy-num\">03</span>フォーカス足跡は任意かつ最小限</h2><div class=\"policy-body\"><ul>\n<li>この機能は既定でオフです。オンにするまで何も記録されません。</li>\n<li>既定では足跡ページを開いている間だけ記録します。閉じれば停止します。</li>\n<li>保存するのはドメイン、フォーカス時間、訪問回数、時間帯ヒストグラムのみです。</li>\n<li>完全な URL、ページタイトル、検索語、スクリーンショット、ページ内容は保存しません。</li>\n<li>データは 30 日で自動的に失効し、「統計を消去」でいつでも削除できます。</li>\n<li>フォーカス足跡は有料版の機能で、CSV 書き出しも同じページにあります。</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-4\"><h2><span class=\"policy-num\">04</span>決して行わないこと</h2><div class=\"policy-body\"><ul>\n<li class=\"no-mark\">❌ 解析、テレメトリ、クラッシュレポート、広告 ID は一切ありません。</li>\n<li class=\"no-mark\">❌ 閲覧データをサーバーへ送信することはありません。</li>\n<li class=\"no-mark\">❌ データを販売したり第三者と共有したりしません。</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-5\"><h2><span class=\"policy-num\">05</span>ネットワーク通信</h2><div class=\"policy-body\"><p>外部への通信はライセンス検証のみで、ライセンスキーを入力したときにだけ発生します。送信内容はライセンスキー、ランダムなインストール ID、プラグイン ID、基本環境情報（ブラウザ名とバージョン、UI 言語、タイムゾーン）で、宛先は api.annmax1983.com、頻度は最大 2 時間に 1 回です。閲覧データは含まれません。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-6\"><h2><span class=\"policy-num\">06</span>権限とその理由</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>権限</th><th>理由</th></tr>\n<tr><td><code>browsingData</code></td><td>選択したデータ種別の削除。中核機能です。</td></tr>\n<tr><td><code>storage</code></td><td>設定とローカルの足跡を端末内に保存します。</td></tr>\n<tr><td><code>alarms</code></td><td>スケジュール実行と、Service Worker 再起動をまたぐフォーカス計測の維持。</td></tr>\n<tr><td><code>tabs</code> / <code>windows</code></td><td>現在のドメイン、サイト単位の操作、最後のウィンドウが閉じた瞬間の検知。</td></tr>\n<tr><td><code>idle</code></td><td>任意の「アイドル後」トリガー。</td></tr>\n<tr><td><code>notifications</code></td><td>削除後の結果摘要の表示。</td></tr>\n<tr><td><code>history</code> <em>(optional)</em></td><td>サイト単位で履歴をプレビューまたは削除するときだけ要求。ローカル利用のみ。</td></tr>\n<tr><td><code>cookies</code> <em>(optional)</em></td><td>サイト単位で Cookie を削除するときだけ要求。</td></tr>\n</table></div>\n<p>任意の権限は該当機能を使う瞬間に要求され、ブラウザ側でいつでも取り消せます。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-7\"><h2><span class=\"policy-num\">07</span>VKT CleanMate にできないこと</h2><div class=\"policy-body\"><ul>\n<li>DNS キャッシュ、ルーターのログ、プロバイダの記録、サーバー側のログは消せません。</li>\n<li>削除した履歴は復元できません。ブラウザに書き込み API はありません。</li>\n<li>他のブラウザのデータ、別のプロファイル、他の端末に同期されたコピーは消せません。</li>\n<li>「ブラウザ終了時」はベストエフォートです。完了前に終了した場合、次回起動の数秒後に補完されます。</li>\n<li>反フォレンジックでも監視対策でもなく、匿名化するものでもありません。</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-8\"><h2><span class=\"policy-num\">08</span>子どもについて</h2><div class=\"policy-body\"><p>VKT CleanMate は汎用ユーティリティであり、13 歳未満の子どもを対象としていません。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-9\"><h2><span class=\"policy-num\">09</span>変更</h2><div class=\"policy-body\"><p>本ポリシーの重要な変更は、上部の「最終更新」日付と拡張機能のリリースノートに反映されます。</p></div></article>\n\n<article class=\"policy-card\" id=\"section-10\"><h2><span class=\"policy-num\">10</span>連絡先</h2><div class=\"policy-body\"><p>プライバシーに関するお問い合わせ：annmax1983.com</p>\n<p><a href=\"mailto:support@annmax1983.com\">support@annmax1983.com</a></p></div></article>"

    "sections": "<article class=\"policy-card\" id=\"section-1\"><h2><span class=\"policy-num\">01</span>Was VKT CleanMate tut</h2><div class=\"policy-body\"><div class=\"box\"><strong>Kurzfassung:</strong> VKT CleanMate ist ein Selbstbedienungswerkzeug für den eigenen Browser. Es erfasst, überträgt und verkauft keine Browserdaten. Alles, was es weiß, bleibt auf Ihrem Gerät.</div>\n<p>VKT CleanMate löscht Browserdaten (Verlauf, Cache, Cookies und weitere Seitendaten), die Sie löschen lassen wollen — geplant oder auf Knopfdruck. Den Umfang bestimmen Sie: nur die Domains Ihrer Reinigungsliste oder alle Domains außer denen Ihrer Schutzliste.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-2\"><h2><span class=\"policy-num\">02</span>Was lokal gespeichert wird</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Gespeichert</th><th>Zweck</th><th>Dauer</th></tr>\n<tr><td>Ihre Einstellungen (Listen, Zeitplan, Datentypen)</td><td>Konfiguration merken</td><td>Bis zur Deinstallation</td></tr>\n<tr><td>Fokus-Fußabdruck (Domain, Fokusdauer, Besuchszahl, Stundenverteilung)</td><td>Anzeige der Fußabdruck-Seite</td><td>30-Tage-Fenster, standardmäßig aus</td></tr>\n<tr><td>Zusammenfassung des letzten Laufs</td><td>Zeigt den Zeitpunkt des letzten Laufs</td><td>Wird bei jedem Lauf überschrieben</td></tr>\n<tr><td>Installations-ID (zufällig)</td><td>Lizenz an ein Gerät binden</td><td>Bis zur Deinstallation</td></tr>\n</table></div></div></article>\n\n<article class=\"policy-card\" id=\"section-3\"><h2><span class=\"policy-num\">03</span>Der Fokus-Fußabdruck ist optional und minimal</h2><div class=\"policy-body\"><ul>\n<li>Die Funktion ist standardmäßig aus. Erst wenn Sie sie einschalten, wird etwas aufgezeichnet.</li>\n<li>Standardmäßig wird nur aufgezeichnet, solange die Fußabdruck-Seite offen ist. Schließen beendet die Aufzeichnung.</li>\n<li>Gespeichert werden nur Domain, Fokusdauer, Besuchszahl und eine Stundenhäufigkeit.</li>\n<li>Keine vollständigen URLs, keine Seitentitel, keine Suchbegriffe, keine Screenshots, keine Seiteninhalte.</li>\n<li>Daten verfallen nach 30 Tagen automatisch und lassen sich jederzeit mit „Statistiken löschen“ entfernen.</li>\n<li>Der Fußabdruck gehört zur bezahlten Stufe; der CSV-Export liegt auf derselben Seite.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-4\"><h2><span class=\"policy-num\">04</span>Was wir niemals tun</h2><div class=\"policy-body\"><ul>\n<li class=\"no-mark\">❌ Keine Analyse, keine Telemetrie, keine Absturzberichte, keine Werbe-IDs.</li>\n<li class=\"no-mark\">❌ Keine Browserdaten werden jemals auf einen Server hochgeladen.</li>\n<li class=\"no-mark\">❌ Keine Daten werden verkauft oder an Dritte weitergegeben.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-5\"><h2><span class=\"policy-num\">05</span>Netzwerkanfragen</h2><div class=\"policy-body\"><p>Die einzige ausgehende Anfrage ist die Lizenzprüfung, und nur wenn Sie einen Lizenzschlüssel eingeben. Sie übermittelt Lizenzschlüssel, zufällige Installations-ID, Plugin-ID und grundlegende Umgebungsdaten (Browsername/-version, UI-Sprache, Zeitzone) an api.annmax1983.com, höchstens alle zwei Stunden. Sie enthält keine Browserdaten.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-6\"><h2><span class=\"policy-num\">06</span>Berechtigungen und ihr Zweck</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Berechtigung</th><th>Zweck</th></tr>\n<tr><td><code>browsingData</code></td><td>Die gewählten Datentypen löschen. Kernfunktion.</td></tr>\n<tr><td><code>storage</code></td><td>Einstellungen und lokalen Fußabdruck auf dem Gerät speichern.</td></tr>\n<tr><td><code>alarms</code></td><td>Geplante Läufe ausführen und die Fokusmessung über Service-Worker-Neustarts hinweg am Leben halten.</td></tr>\n<tr><td><code>tabs</code> / <code>windows</code></td><td>Aktuelle Domain, Aktionen pro Seite und den Moment erkennen, in dem das letzte Fenster schließt.</td></tr>\n<tr><td><code>idle</code></td><td>Optionaler Auslöser „nach Inaktivität“.</td></tr>\n<tr><td><code>notifications</code></td><td>Ergebniszusammenfassung nach einem Lauf anzeigen.</td></tr>\n<tr><td><code>history</code> <em>(optional)</em></td><td>Nur beim Prüfen oder Löschen von Verlauf pro Seite angefragt. Ausschließlich lokal.</td></tr>\n<tr><td><code>cookies</code> <em>(optional)</em></td><td>Nur beim Löschen von Cookies pro Seite angefragt.</td></tr>\n</table></div>\n<p>Optionale Berechtigungen werden im Moment der Nutzung angefragt und lassen sich im Browser jederzeit entziehen.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-7\"><h2><span class=\"policy-num\">07</span>Was VKT CleanMate nicht kann</h2><div class=\"policy-body\"><ul>\n<li>DNS-Caches, Router-Protokolle, Provider-Aufzeichnungen und serverseitige Logs bleiben unberührt.</li>\n<li>Gelöschten Verlauf kann es nicht wiederherstellen — der Browser bietet keine API dafür.</li>\n<li>Andere Browser, andere Profile oder eine synchronisierte Kopie auf einem anderen Gerät werden nicht gereinigt.</li>\n<li>„Beim Schließen“ ist Best-Effort: Endet der Browser vor Abschluss, wird der Lauf Sekunden nach dem nächsten Start vollendet.</li>\n<li>Es ist kein Anti-Forensik- oder Überwachungsschutz-Werkzeug und macht Sie nicht anonym.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-8\"><h2><span class=\"policy-num\">08</span>Kinder</h2><div class=\"policy-body\"><p>VKT CleanMate ist ein allgemeines Werkzeug und richtet sich nicht an Kinder unter 13 Jahren.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-9\"><h2><span class=\"policy-num\">09</span>Änderungen</h2><div class=\"policy-body\"><p>Wesentliche Änderungen dieser Erklärung erscheinen im Datum „Zuletzt aktualisiert“ oben und in den Versionshinweisen der Erweiterung.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-10\"><h2><span class=\"policy-num\">10</span>Kontakt</h2><div class=\"policy-body\"><p>Fragen zum Datenschutz: annmax1983.com</p>\n<p><a href=\"mailto:support@annmax1983.com\">support@annmax1983.com</a></p></div></article>"

    "sections": "<article class=\"policy-card\" id=\"section-1\"><h2><span class=\"policy-num\">01</span>Qué hace VKT CleanMate</h2><div class=\"policy-body\"><div class=\"box\"><strong>Versión corta:</strong> VKT CleanMate es una herramienta de privacidad de autoservicio para tu propio navegador. No recopila, transmite ni vende tus datos de navegación. Todo lo que sabe se queda en tu dispositivo.</div>\n<p>VKT CleanMate elimina los datos de navegación (historial, caché, cookies y otros datos de sitio) que le pides borrar, de forma programada o bajo demanda. Tú controlas el alcance: solo los dominios de tu lista de limpieza, o todos menos los de tu lista de protección.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-2\"><h2><span class=\"policy-num\">02</span>Datos que guardamos en local</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Dato guardado</th><th>Para qué</th><th>Duración</th></tr>\n<tr><td>Tus ajustes (listas, programación, tipos de datos)</td><td>Recordar tu configuración</td><td>Hasta que desinstales</td></tr>\n<tr><td>Huella de enfoque (dominio, duración, número de visitas, distribución horaria)</td><td>Alimentar la página de huella</td><td>Ventana de 30 días, desactivada por defecto</td></tr>\n<tr><td>Resumen de la última limpieza</td><td>Mostrar cuándo fue la última ejecución</td><td>Se sobrescribe en cada ejecución</td></tr>\n<tr><td>ID de instalación (aleatorio)</td><td>Vincular una licencia a un dispositivo</td><td>Hasta que desinstales</td></tr>\n</table></div></div></article>\n\n<article class=\"policy-card\" id=\"section-3\"><h2><span class=\"policy-num\">03</span>La huella de enfoque es opcional y mínima</h2><div class=\"policy-body\"><ul>\n<li>La función está desactivada por defecto. No se registra nada hasta que la actives.</li>\n<li>Por defecto solo registra mientras la página de huella está abierta. Si la cierras, se detiene.</li>\n<li>Solo guarda el dominio, la duración enfocada, el número de visitas y una distribución por horas.</li>\n<li>No guarda URL completas, títulos de página, términos de búsqueda, capturas ni contenido de la página.</li>\n<li>Los datos caducan a los 30 días y pueden borrarse en cualquier momento con «Borrar estadísticas».</li>\n<li>La huella forma parte de la versión de pago; la exportación CSV está en la misma página.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-4\"><h2><span class=\"policy-num\">04</span>Lo que nunca hacemos</h2><div class=\"policy-body\"><ul>\n<li class=\"no-mark\">❌ Sin analítica, sin telemetría, sin informes de fallos, sin identificadores publicitarios.</li>\n<li class=\"no-mark\">❌ Ningún dato de navegación se sube a un servidor.</li>\n<li class=\"no-mark\">❌ No se venden ni se comparten datos con terceros.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-5\"><h2><span class=\"policy-num\">05</span>Peticiones de red</h2><div class=\"policy-body\"><p>La única petición saliente es la validación de licencia, y solo si introduces una clave. Envía la clave, un ID de instalación aleatorio, el ID del plugin e información básica del entorno (nombre y versión del navegador, idioma de la interfaz, zona horaria) a api.annmax1983.com, como máximo cada dos horas. No contiene datos de navegación.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-6\"><h2><span class=\"policy-num\">06</span>Permisos y por qué hacen falta</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Permiso</th><th>Para qué</th></tr>\n<tr><td><code>browsingData</code></td><td>Eliminar los tipos de datos que elijas. Función principal.</td></tr>\n<tr><td><code>storage</code></td><td>Guardar tus ajustes y la huella local en el dispositivo.</td></tr>\n<tr><td><code>alarms</code></td><td>Ejecutar limpiezas programadas y mantener el cronómetro de enfoque entre reinicios del service worker.</td></tr>\n<tr><td><code>tabs</code> / <code>windows</code></td><td>Detectar el dominio activo, las acciones por sitio y el momento en que se cierra la última ventana.</td></tr>\n<tr><td><code>idle</code></td><td>Disparador opcional «tras inactividad».</td></tr>\n<tr><td><code>notifications</code></td><td>Mostrar el resumen del resultado tras una limpieza.</td></tr>\n<tr><td><code>history</code> <em>(optional)</em></td><td>Se solicita solo al previsualizar o limpiar historial por sitio. Uso exclusivamente local.</td></tr>\n<tr><td><code>cookies</code> <em>(optional)</em></td><td>Se solicita solo al limpiar cookies por sitio.</td></tr>\n</table></div>\n<p>Los permisos opcionales se piden en el momento de usar la función correspondiente y pueden revocarse en el navegador cuando quieras.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-7\"><h2><span class=\"policy-num\">07</span>Lo que VKT CleanMate no puede hacer</h2><div class=\"policy-body\"><ul>\n<li>No borra cachés DNS, registros del router, registros del proveedor ni logs del servidor.</li>\n<li>No restaura el historial borrado: el navegador no ofrece API para escribirlo.</li>\n<li>No limpia otros navegadores, otros perfiles ni una copia sincronizada en otro dispositivo.</li>\n<li>«Al cerrar el navegador» es un mejor esfuerzo: si el navegador se cierra antes de terminar, la limpieza se completa segundos después del siguiente arranque.</li>\n<li>No es una herramienta antiforense ni antisorveillance, y no te hace anónimo.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-8\"><h2><span class=\"policy-num\">08</span>Menores</h2><div class=\"policy-body\"><p>VKT CleanMate es una utilidad de propósito general y no está dirigida a menores de 13 años.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-9\"><h2><span class=\"policy-num\">09</span>Cambios</h2><div class=\"policy-body\"><p>Los cambios materiales de esta política se reflejarán en la fecha de «Última actualización» y en las notas de la versión de la extensión.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-10\"><h2><span class=\"policy-num\">10</span>Contacto</h2><div class=\"policy-body\"><p>Dudas sobre privacidad: annmax1983.com</p>\n<p><a href=\"mailto:support@annmax1983.com\">support@annmax1983.com</a></p></div></article>"

    "sections": "<article class=\"policy-card\" id=\"section-1\"><h2><span class=\"policy-num\">01</span>Ce que fait VKT CleanMate</h2><div class=\"policy-body\"><div class=\"box\"><strong>Version courte :</strong> VKT CleanMate est un outil de confidentialité en libre-service pour votre propre navigateur. Il ne collecte, ne transmet et ne vend aucune donnée de navigation. Tout ce qu’il sait reste sur votre appareil.</div>\n<p>VKT CleanMate supprime les données de navigation (historique, cache, cookies et autres données de site) que vous lui demandez de supprimer, selon un planning ou à la demande. Vous décidez de la portée : seulement les domaines de votre liste de nettoyage, ou tous sauf ceux de votre liste de protection.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-2\"><h2><span class=\"policy-num\">02</span>Données stockées localement</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Élément stocké</th><th>Finalité</th><th>Durée</th></tr>\n<tr><td>Vos réglages (listes, planning, types de données)</td><td>Mémoriser votre configuration</td><td>Jusqu’à désinstallation</td></tr>\n<tr><td>Empreinte de concentration (domaine, durée, nombre de visites, répartition horaire)</td><td>Alimenter la page d’empreinte</td><td>Fenêtre de 30 jours, désactivée par défaut</td></tr>\n<tr><td>Résumé du dernier nettoyage</td><td>Afficher la date de la dernière exécution</td><td>Écrasé à chaque exécution</td></tr>\n<tr><td>ID d’installation (aléatoire)</td><td>Lier une licence à un appareil</td><td>Jusqu’à désinstallation</td></tr>\n</table></div></div></article>\n\n<article class=\"policy-card\" id=\"section-3\"><h2><span class=\"policy-num\">03</span>L’empreinte de concentration est facultative et minimale</h2><div class=\"policy-body\"><ul>\n<li>La fonction est désactivée par défaut. Rien n’est enregistré tant que vous ne l’activez pas.</li>\n<li>Par défaut, elle n’enregistre que tant que la page d’empreinte est ouverte. La fermer arrête l’enregistrement.</li>\n<li>Elle ne stocke que le domaine, la durée de concentration, le nombre de visites et une répartition horaire.</li>\n<li>Elle ne stocke ni URL complètes, ni titres de page, ni termes de recherche, ni captures, ni contenu de page.</li>\n<li>Les données expirent après 30 jours et peuvent être effacées à tout moment avec « Effacer les statistiques ».</li>\n<li>L’empreinte fait partie de l’offre payante ; l’export CSV se trouve sur la même page.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-4\"><h2><span class=\"policy-num\">04</span>Ce que nous ne faisons jamais</h2><div class=\"policy-body\"><ul>\n<li class=\"no-mark\">❌ Pas d’analytique, pas de télémétrie, pas de rapports de plantage, pas d’identifiants publicitaires.</li>\n<li class=\"no-mark\">❌ Aucune donnée de navigation n’est envoyée à un serveur.</li>\n<li class=\"no-mark\">❌ Aucune donnée n’est vendue ni partagée avec des tiers.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-5\"><h2><span class=\"policy-num\">05</span>Requêtes réseau</h2><div class=\"policy-body\"><p>La seule requête sortante est la vérification de licence, et uniquement si vous saisissez une clé. Elle transmet la clé, un ID d’installation aléatoire, l’ID du plugin et des informations d’environnement (nom et version du navigateur, langue de l’interface, fuseau horaire) à api.annmax1983.com, au plus une fois toutes les deux heures. Elle ne contient aucune donnée de navigation.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-6\"><h2><span class=\"policy-num\">06</span>Autorisations et leur raison d’être</h2><div class=\"policy-body\"><div class=\"table-wrap\"><table>\n<tr><th>Autorisation</th><th>Pourquoi</th></tr>\n<tr><td><code>browsingData</code></td><td>Supprimer les types de données choisis. Fonction principale.</td></tr>\n<tr><td><code>storage</code></td><td>Conserver vos réglages et l’empreinte locale sur l’appareil.</td></tr>\n<tr><td><code>alarms</code></td><td>Exécuter les nettoyages planifiés et maintenir le chronomètre de concentration entre les redémarrages du service worker.</td></tr>\n<tr><td><code>tabs</code> / <code>windows</code></td><td>Détecter le domaine actif, les actions par site et le moment où la dernière fenêtre se ferme.</td></tr>\n<tr><td><code>idle</code></td><td>Déclencheur facultatif « après inactivité ».</td></tr>\n<tr><td><code>notifications</code></td><td>Afficher le résumé du résultat après un nettoyage.</td></tr>\n<tr><td><code>history</code> <em>(optional)</em></td><td>Demandée uniquement pour prévisualiser ou nettoyer l’historique par site. Usage strictement local.</td></tr>\n<tr><td><code>cookies</code> <em>(optional)</em></td><td>Demandée uniquement pour nettoyer les cookies par site.</td></tr>\n</table></div>\n<p>Les autorisations facultatives sont demandées au moment de l’usage et peuvent être révoquées dans le navigateur à tout moment.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-7\"><h2><span class=\"policy-num\">07</span>Ce que VKT CleanMate ne sait pas faire</h2><div class=\"policy-body\"><ul>\n<li>Il ne vide pas les caches DNS, les journaux du routeur, les enregistrements du fournisseur ni les logs serveur.</li>\n<li>Il ne restaure pas l’historique supprimé : le navigateur n’offre aucune API pour l’écrire.</li>\n<li>Il ne nettoie pas les autres navigateurs, les autres profils, ni une copie synchronisée ailleurs.</li>\n<li>« À la fermeture » est du meilleur effort : si le navigateur quitte avant la fin, le nettoyage se termine quelques secondes après le démarrage suivant.</li>\n<li>Ce n’est ni un outil antiforensique ni un anti-surveillance, et il ne vous rend pas anonyme.</li>\n</ul></div></article>\n\n<article class=\"policy-card\" id=\"section-8\"><h2><span class=\"policy-num\">08</span>Enfants</h2><div class=\"policy-body\"><p>VKT CleanMate est un utilitaire généraliste qui ne s’adresse pas aux enfants de moins de 13 ans.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-9\"><h2><span class=\"policy-num\">09</span>Modifications</h2><div class=\"policy-body\"><p>Les changements substantiels de cette politique apparaîtront dans la date de « Dernière mise à jour » ci-dessus et dans les notes de version de l’extension.</p></div></article>\n\n<article class=\"policy-card\" id=\"section-10\"><h2><span class=\"policy-num\">10</span>Contact</h2><div class=\"policy-body\"><p>Questions de confidentialité : annmax1983.com</p>\n<p><a href=\"mailto:support@annmax1983.com\">support@annmax1983.com</a></p></div></article>"

const MAP = { en: 'en', zh_CN: 'zh', ja: 'ja', de: 'de', es: 'es', fr: 'fr' };
const BACK = { en: 'en', zh: 'zh_CN', ja: 'ja', de: 'de', es: 'es', fr: 'fr' };
const KEY = 'cleanmate_lang';

function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q) {
    if (POLICY.langs[q]) return q;
    if (BACK[q]) return BACK[q];
  }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && POLICY.langs[saved]) return saved;
  const nav = (navigator.language || 'en').replace('-', '_');
  if (POLICY.langs[nav]) return nav;
  const short = nav.split('_')[0];
  if (short === 'zh') return 'zh_CN';
  return POLICY.langs[short] ? short : 'en';
}

function apply(lang) {
  const d = POLICY.langs[lang];
  document.documentElement.lang = lang === 'zh_CN' ? 'zh-CN' : lang;
  document.getElementById('p-eyebrow').textContent = d.eyebrow;
  document.getElementById('p-h1-sub').textContent = d.sub;
  document.getElementById('p-summary').textContent = d.summary;
  document.getElementById('p-updated').textContent = d.updated;
  document.getElementById('p-toc-title').textContent = d.tocTitle;
  document.getElementById('p-footer-more').textContent = d.footerMore;
  document.getElementById('p-footer-home').textContent = d.footerHome;
  document.getElementById('p-footer-site').textContent = d.footerSite;
  document.getElementById('p-chips').innerHTML = d.chips.map((c) => '<span class="chip">' + c + '</span>').join('');
  document.getElementById('p-toc').innerHTML = d.toc
    .map(([n, t]) => '<a href="#section-' + Number(n) + '"><span>' + n + '</span>' + t + '</a>').join('');
  document.getElementById('p-sections').innerHTML = d.sections;
  document.getElementById('p-lang').value = MAP[lang];
  document.title = 'VKT CleanMate — ' + d.sub;
  try { localStorage.setItem(KEY, lang); } catch (e) {}
}

document.getElementById('p-lang').addEventListener('change', (e) => {
  apply(BACK[e.target.value] || 'en');
});

apply(pickLang());
</script>
</body>
</html>
